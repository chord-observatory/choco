# Example bffs config.
#
# bffs runs once per invocation (a systemd timer/oneshot sets the cadence): it
# reads the feed labels and autocorrelation data from one kotekan N² output file,
# combines each source's mask, and POSTs the bad-input list to choco.

# The kotekan hdf5N2Write output; its autocorrelation data drives the
# power-outlier source. Feed labels (and the element axis bad_inputs
# indices address) come from the kotekan config's dish_inputs table via
# choco; the file's own index map is the fallback when choco is down.
# A glob is allowed and may span directories — each run reads the newest
# match by mtime, so with kotekan writing one acquisition directory at a
# time this follows the most recently written file of the current
# acquisition.
kotekan_file: /mnt/cs00/data/kotekan_vis_files/full/acq_*/*.h5

# A newest kotekan file older than this many seconds is unusable (a
# stopped acquisition's empty tail rows would mark every feed dead):
# file-based sources (power-outlier) are skipped with a warning and the
# other sources still flag. The run only fails (red BFFS badge) when
# every configured source ends up skipped. 0 disables the check.
max_age: 3600

choco:
  # choco's web API. Flags go to POST <url>/update/<group> as an
  # updatable_config action; choco relays them to every kotekan node in the
  # group at POST /<endpoint>. Auth is bypassed for localhost callers, so run
  # bffs on the choco host. Unset url -> dry run (payload printed, not sent).
  url: https://localhost:5000
  group: cx                                # node group in choco's nodes.yaml
  endpoint: updatable_config/bad_inputs    # kotekan updatable endpoint
  sync_delay: 5.0

state:
  # A JSON file recording the feed change history (every transition, by label).
  # When set, bffs sends to choco only when the bad list changes. Omit the whole
  # block to run stateless (send every invocation).
  path: /var/lib/bffs/state.json
  max_history: 0                 # cap on history entries (0 = keep all)

# A feed is bad if any source flags it. Each source is one entry below.
sources:
  - kind: manual                 # feeds an operator listed in a watched file
    path: /data/bffs/manual_overrides.yaml

  - kind: power-outlier          # band-averaged power, outlier across feeds
    chunk: 16                     # most recent N time rows to average
    nsigma: 5.0
    freq_lo: 400.0
    freq_hi: 800.0
    min_valid_frac: 0.5

  # External-service sources (provisional until the hardware is live; map
  # defaults to sources/<name>_map.csv — fpga's is the rack wiring table,
  # power's is a placeholder pending padloper).
  # - kind: power                # feeds whose amplifier is unpowered (power_db)
  #   url: http://10.222.0.30:5000
  #   map: sources/power_map.csv
  #
  # - kind: fpga                 # F-engine health: overflow / no frames / ADC RMS
  #   url: http://fpga-node:5000
  #   map: sources/fpga_map.csv
  #
  # - kind: rfi                  # per-feed spectral kurtosis from kotekan
  #   # With no urls, the endpoints are derived from choco's node registry:
  #   # every *started* node of the broadcast group above (override with
  #   # group:) is polled at each sk_paths entry, so new nodes are picked
  #   # up automatically. No started nodes -> the run fails (red badge).
  #   # sk_paths must match the kotekan config's RfiSKMetrics instances
  #   # (default: sk_metrics_0 and sk_metrics_1).
  #   # sk_paths:
  #   #   - rfi_sk_metrics/sk_metrics_0/sk
  #   #   - rfi_sk_metrics/sk_metrics_1/sk
  #   # urls:                    # ...or list explicit endpoints instead
  #   #   - http://cx27.site.chord-observatory.ca:12048/rfi_sk_metrics/sk_metrics_0/sk
  #   sk_lo: 0.7                 # SK bounds: clean Gaussian noise has SK ~= 1
  #   sk_hi: 1.5
  #   min_valid_frac: 0.25       # ignore feeds with fewer valid SK cells
