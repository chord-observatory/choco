# Example eigencal feed layout -- an OPTIONAL override.
#
# By default eigencal derives the feed layout from the N² file itself:
# kotekan records each element's polarisation (index_map/pol), dish type
# (index_map/type: only ArrayDish elements are calibrated) and position
# (the feed_positions_m attribute).  Point telescope.feed_layout at a
# file like this one only to calibrate a file without that geometry, or
# to hand-pick which feeds are fitted.  When set, it replaces the file's
# geometry entirely: feeds present in the file but missing here are not
# calibrated (gain 0, weight 0), and the DishType is ignored.
#
# Positions are metres East/North of any fixed local origin; only
# differences matter (each polarisation is referenced to its
# phase_reference feed, which is required here).  Pick reference feeds
# that are reliably healthy -- a sample where the reference is flagged
# cannot be phase-referenced and is dropped from the fit.
#
# Label convention: the labels of the file's *element* axis in choco's
# names -- dish label + X/Y (pol 0 = X), one entry per element, both
# polarisations of every dish (A1X ... A1Y ...).  n2_io spells kotekan's
# per-element index_map/label (A1p1/A1p2) that way.

phase_reference:
  X: A1X
  Y: A1Y

feeds:
  - {label: A1X, pol: X, ew_m: 0.000, ns_m: 0.000}
  - {label: A2X, pol: X, ew_m: 6.300, ns_m: 0.000}
  # ... the X block, one entry per dish ...
  - {label: A1Y, pol: Y, ew_m: 0.000, ns_m: 0.000}
  - {label: A2Y, pol: Y, ew_m: 6.300, ns_m: 0.000}
  # ... then the Y block, same dishes ...
