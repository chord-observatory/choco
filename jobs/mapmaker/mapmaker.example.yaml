# mapmaker — three-band drift-scan sky maps from the kotekan N² files.
#
# Copy to /etc/choco/mapmaker.yaml and edit.  Each run (choco-mapmaker.timer,
# every 2 min) folds the files that landed since the last run into two maps
# -- the sky map (every pass, Sun excluded) and the daily map (the last
# sidereal day) -- and renders them as RGB PNGs with frequency as hue, red
# at the bottom of the band and violet at the top.  See jobs/mapmaker/README.md.

# Source roots.  The subset files carry the 16 array dishes and are what
# is imaged; `full` adds nothing but 80 Missing elements.
roots:
  - name: subset
    path: /mnt/cs00/data/kotekan_vis_files/subset

# Where the dishes point, in declination.  The beam model, the Dec strip of
# the map and the choice of calibrator all hang off this.  Not read from
# kotekan: its dish_coelev_deg has been wrong (-27.3 = Tau A) while Cyg A
# transited through the beam at dec 40.8.  Changing it starts the maps afresh.
pointing_dec_deg: 40.8

# Colour bins: the spectrum colour_range_mhz is cut into colour_bins
# log-spaced slices, each imaged separately and painted in the hue of the
# visible light it maps onto (the bottom of the range red, the top violet);
# a pixel's colour is the brightness-weighted sum of its bins' hues.  Every
# channel outside the RFI exclusions below contributes.  A source with the
# calibrator's spectrum is white; steeper is redder, flatter bluer.  More
# bins cost memory (each is 2 pol x 81 rows x 4096 bins x 4 B, twice, for
# the sky map and twice again for the daily map: ~16 MB per bin) and a
# longer per-run write of maps.npz; 16 is ~260 MB.  Changing either starts
# the maps afresh.
colour_bins: 16
colour_range_mhz: [300, 1500]

# Imaging sub-band width in channels (64 = 12.5 MHz).  Visibilities are
# averaged over a sub-band only after the per-channel gains are applied;
# wider sub-bands smear sources at the beam edge (phase winds with frequency
# on the long baselines), narrower ones cost proportionally more compute.
subband_channels: 64

# Channels excluded outright, [lo, hi] MHz.  Measured in the 2026-10-04
# subset data: TV/LTE bands with 14-49% of samples excised by kotekan's RFI
# stage; the per-sample fraction below handles the rest.
bad_freq_mhz:
  - [350, 400]
  - [600, 650]
  - [700, 800]
  - [850, 900]
  - [1150, 1300]
# A (channel, sample) with more than this fraction of its data excised for
# RFI (frac_rfi in the file) is dropped.  null disables the test.
max_rfi_fraction: 0.05

# The map grid: sidereal bins in RA (4096 = 0.088 deg, two 10 s samples per
# bin) and a strip of Dec rows centred on the pointing.  With two rows of
# dishes the Dec axis only localises in the band average (grating lobes
# every lambda/8.5 m per band); the strip just has to cover the beam at
# 300 MHz.  Changing these starts the maps afresh.
n_ra_bins: 4096
dec_halfwidth_deg: 10
dec_step_deg: 0.25

# The primary beam: Gaussian with FWHM beam_fwhm_factor * lambda / D
# (1.03 = Airy; Cyg A transits measured within 15% of it).  footprint_fwhm
# is how far, in FWHM, a sample is scattered into the map.  These define
# the kernel the maps are accumulated through and the deconvolution's
# dirty beam, so changing them starts the maps afresh.
dish_diameter_m: 6.0
beam_fwhm_factor: 1.03
footprint_fwhm: 1.2

# The sky map skips samples with the Sun closer than this to the pointing
# direction; the daily map keeps them.  0 keeps everything.
sun_exclusion_deg: 30

# Point sources the maps are calibrated on (ICRS degrees).  The first whose
# transit passes within calibrator_max_offset_deg of the pointing is used:
# each time it transits, the samples within calibration_window_deg of it on
# the sky give new per-channel, per-product gains, and the maps are in units
# of its flux density.  A transit with fewer than min_cal_samples usable
# samples keeps the old gains; a product fainter than dead_fraction of its
# channel's median is a dead feed and is excluded.
calibrators:
  - {name: Cyg A, ra_deg: 299.86815, dec_deg: 40.73392}
  - {name: Cas A, ra_deg: 350.86642, dec_deg: 58.81178}
  - {name: Tau A, ra_deg: 83.63308, dec_deg: 22.01450}
  - {name: Vir A, ra_deg: 187.70593, dec_deg: 12.39112}
calibrator_max_offset_deg: 5
calibration_window_deg: 3
min_cal_samples: 60
dead_fraction: 0.05

# Display.  The stretch maps brightness to intensity with one curve for
# every colour bin, so equal brightness across bins stays white:
#   arcsinh   asinh(x/soft) / asinh(max/soft): linear below soft, log above
#   log       log(1 + x/soft) / log(1 + max/soft)
#   equalize  histogram equalisation of the pixels above a noise floor
#             (median + floor_sigma * robust sigma of all mapped pixels).
#             Beware: the map is ~1e5 deep and the floor lands at ~1e-4 of
#             the calibrator, so a rank stretch paints a 1% grating lobe at
#             full intensity and every source becomes a vertical bar.
# soft and max are in calibrator-flux units (Cyg A = 1).  Pixels with less
# than exposure_floor of a bin's peak exposure are left out of that bin,
# and the raw strip PNG repeats each Dec row row_repeat times so it is
# visible at native size.
stretch: {mode: arcsinh, floor_sigma: 3, soft: 0.001, max: 1.0}
exposure_floor: 0.02
row_repeat: 4

# Deconvolution (choco-mapmaker-clean.timer, every 15 min): a joint-bin
# Hogbom CLEAN of the sky map against the dirty beam it was made with,
# which removes the two-row array's Dec ridge.  gain is the fraction of a
# peak subtracted per iteration; the loop stops at threshold_sigma times
# the robust sigma of the broadband map or at max_iterations; the
# components are restored with a Gaussian beam of beam_ra_deg x
# beam_dec_deg (FWHM; 1.5 deg in Dec is what the band sum localises to)
# and painted with their own stretch.  A run takes about a minute per
# 10,000 iterations on the choco VM.
clean:
  gain: 0.25
  threshold_sigma: 5
  max_iterations: 20000
  beam_ra_deg: 0.6
  beam_dec_deg: 1.5
  stretch: {mode: arcsinh, soft: 0.001, max: 1.0}

# The deconvolution also draws context.png: the deconvolved strip pasted
# into the 408 MHz all-sky map (log scale, RA x Dec).  The default is the
# skymap job's copy of the map, which choco.sh install fetches
# (/opt/choco/jobs/skymap/haslam408_ds_Remazeilles2014.fits); "" draws no
# context image.  A missing file costs only that image (degraded).
#background_map: /opt/choco/jobs/skymap/haslam408_ds_Remazeilles2014.fits

# Where to start when there is no state yet: an acquisition name
# (acq_YYYYMMDD_...) to backfill from, or null for the newest acquisition.
backfill_from: null

# Files folded per run.  Each costs the NFS read of a 1.6 GB file (~20 s)
# plus a few seconds of imaging; files land every ~3.2 min, so the live data
# keeps up at any value above 1.  0 means unlimited, for a hand-run backfill.
max_files_per_run: 10

# The maps (maps.npz), gains (gains.npz), state.json, clean.json, the PNGs
# and the locks live in /var/lib/choco/mapmaker, the job's state directory,
# which is also where choco reads them from.  Not a setting; --state-dir
# redirects a hand run.
