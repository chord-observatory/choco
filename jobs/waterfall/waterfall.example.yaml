# waterfall — per-acquisition upper-triangle visibility waterfalls.
#
# Copy to /etc/choco/waterfall.yaml and edit.  Rendering is driven
# entirely by what has landed on disk: each run folds newly-arrived
# source files into their acquisition's images and exits.

# Source roots to render.  Only these are touched -- `full` and `old`
# are deliberately left alone.
roots:
  - name: subset
    path: /mnt/cs00/data/kotekan_vis_files/subset

# Where the images go.  A sibling of the data, not a subdirectory of each
# acquisition: the acquisition directories are owned by the (NFS-squashed)
# writer and are not writable by anyone else.  The tree mirrors the source
# layout, <waterfalls_dir>/<root name>/<acq>/, and holds nothing but
# relative paths, so it can be moved or copied wholesale with the data.
waterfalls_dir: /mnt/cs00/data/kotekan_vis_files/waterfalls

# Job state (state.json, read back by choco's WF badge and /service/waterfall
# page) and the exclusive run lock (waterfall.lock: two runs appending to the
# same image would interleave their deflate segments, so a second run exits 0
# immediately) live in /var/lib/choco/waterfall, the job's state directory.
# Not a setting; --state-dir redirects a hand run.

# What of a file becomes pixels.  Fixed per acquisition when it starts
# (the images are append-only), so this shapes new acquisitions only.
#
# `all` renders every product.  With 128 elements that is 8256 images per
# acquisition and a 2 GB buffer per file; this rule keeps 254: every
# autocorrelation, and every same-polarization cross product with the
# reference elements (A01X: all X dishes against A01; A01Y likewise), so
# each dish shows its fringe against one reference.  `pairs` adds named
# cross products.  A label the file does not carry is reported and skipped.
products:
  autos: true
  reference: [A01X, A01Y]
  pairs: []

# Frequency chunks kept per file: 1 keeps every channel, 4 keeps one
# 16-channel chunk in four (a column is still a real channel).  kotekan
# chunks vis as 16 channels x every product x every time bin and a chunk
# decompresses whole, so the read is priced in chunks: at 128 elements a
# file is 16 GB of vis.  The X-engine streams are a comb (channel mod 16),
# so every chunk holds every node and a stride cannot hide a node, only
# the detail between kept chunks.  With the overview below every chunk is
# wanted anyway: 1.
freq_stride: 1

# Fold one file in this many, by kotekan's file index.  Time is the one
# axis a read can be thinned along, and only in whole files: a chunk
# spans every bin of its file.  A full pass over a 12 GB file is about
# 3.5 min on a link that gives 36-59 MB/s, against the 400 s cadence, with
# the mapmaker's minute beside it; 2 halves the load and the overview
# still gets a frame every 13 min.
file_stride: 1

# The overview, kept beside the selected images from the same pass: every
# product at chunk resolution (coarse.dat: mean |V| per chunk, one row per
# file, any of the 8256 products viewable on request), each element's
# coherence with the array (co_eNNNN.png: mean over its partners of
# |V_ab| / sqrt(V_aa V_bb) per chunk, one scanline per file), and the
# element x element matrix of the same coherence per band, one frame per
# file (matrix.dat; the /files/<root>/<acq>/matrix page).  Fixed per
# acquisition when it starts.
overview: true
matrix_bands: 8

# choco's API and the X-engine node group, to name the node behind each
# stream of a file that has just landed (read from each started node's
# kotekan /metrics, once per run).  Leave out for unnamed streams.
choco:
  url: https://localhost:5000
  group: cx

# Deflate level.  6 is the balance point (level 9 costs 3.5x the CPU for
# 0.58% fewer bytes); 4 is worth passing for a long backfill.
level: 6

# Files folded per run, across all acquisitions.  Acquisitions are visited
# newest first, so the live one always keeps up and the rest backfill
# behind it.  0 means unlimited -- reasonable for a one-off backfill run,
# but not from the timer, where a 24 h run would starve the live data.
#
# This is also the only effective throttle against kotekan: the reads go
# over NFS, which neither Nice nor IOSchedulingClass governs.  Live data
# keeps up at any value above 1: a 12 GB file lands every 400 s and takes
# about a minute with the selection and stride above; a backfill of the
# old 2.8 GB files runs at 40 per run.
max_files_per_run: 40
