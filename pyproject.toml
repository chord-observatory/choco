[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "choco"
version = "0.1.0"
description = "CHORD Config Orchestrator — manages kotekan instances on a cluster"
requires-python = ">=3.10"
# Core = what the choco web service itself imports.  The scientific
# stack lives in the [jobs] extra: only the timer jobs (EOP, bffs,
# eigencal) need it, and keeping it out of core shrinks the web-facing
# process's supply chain.  choco.sh installs .[jobs], so a deployed venv
# still carries everything.
dependencies = [
    "flask>=3.0",
    "jinja2>=3.1",        # imported directly by state.py (config rendering); a flask dep anyway
    "flask-login>=0.6",
    "ldap3>=2.9",
    "gevent>=24.0",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
jobs = [
    "astropy>=6.0",
    "numpy>=1.26",
    "h5py>=3.6",
    "hdf5plugin>=4.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "responses>=0.25",    # mocks `requests` in test_kotekan / test_services
]

[project.scripts]
choco = "choco.cli:main"          # CLI client (choco/cli.py)
choco-server = "choco.app:main"   # the daemon

[tool.setuptools.packages.find]
include = ["choco*"]

[tool.setuptools.package-data]
choco = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
