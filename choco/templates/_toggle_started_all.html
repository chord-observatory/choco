{% set _group = group|default(none) %}
{% set _url = "/nodes/set-started-group/" ~ _group if _group else "/nodes/set-started-all" %}
{% set _scope = '"' ~ _group ~ '"' if _group else "all" %}
<span style="display: inline-flex; gap: 0.25em;" hx-ext="morph">
    <button class="outline" title="Set {{ _scope }} nodes to idle" style="padding: 0.1em 0.4em; margin: 0; font-size: 0.8em; background: #ffdc00; color: #333; border-color: #ffdc00;"
            hx-post="{{ _url }}/stop" hx-target="#dashboard-table" hx-swap="morph:innerHTML"
            hx-vals='{"_csrf_token": "{{ csrf_token() }}"}'>&#x25BC;</button>
    <button class="outline" title="Set {{ _scope }} nodes to started" style="padding: 0.1em 0.4em; margin: 0; font-size: 0.8em; background: #008000; color: white; border-color: #008000;"
            hx-post="{{ _url }}/start" hx-target="#dashboard-table" hx-swap="morph:innerHTML"
            hx-vals='{"_csrf_token": "{{ csrf_token() }}"}'>&#x25B2;</button>
</span>
