{% extends "base.html" %}
{% block title %}Sign in — CHOCO{% endblock %}

{% block styles %}
main.container { max-width: 400px; margin-top: 10vh; }
{% endblock %}

{% block content %}
<h2>Sign in</h2>
{% if proxy_only %}
<div class="notice"><p>Sign in through the site: <a href="{{ proxy_url }}">{{ proxy_url }}</a>.</p></div>
{% else %}
<form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Log in</button>
</form>
{% endif %}
{% endblock %}
