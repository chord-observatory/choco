<div class="journal-head">
    <small>journalctl -u {{ unit }} -n {{ nlines }}</small>
    <button hx-get="/partials/service-logs/{{ name }}?lines={{ nlines }}"
            hx-target="#journal" hx-swap="innerHTML"
            title="Refresh" class="secondary outline btn-sm" style="margin-left: auto;">&#x21bb;</button>
</div>
{% if lines is none %}
<p class="note"><em>Journal unavailable — no journalctl on this host
(or reading unit {{ unit }} failed).</em></p>
{% elif not lines %}
<p class="note"><em>No journal entries for {{ unit }}.</em></p>
{% else %}
<pre>{{ lines | join('\n') }}</pre>
{% endif %}
