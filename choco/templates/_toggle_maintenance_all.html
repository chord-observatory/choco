{% set _group = group|default(none) %}
{% set _url = "/nodes/set-maintenance-group/" ~ _group if _group else "/nodes/set-maintenance-all" %}
{% set _scope = '"' ~ _group ~ '"' if _group else "all" %}
<span style="display: inline-flex; gap: 0.25em;" hx-ext="morph">
    <button class="outline" title="Put {{ _scope }} nodes in maintenance (choco will not push)" style="padding: 0.1em 0.4em; margin: 0; font-size: 0.8em; background: #ff851b; color: white; border-color: #ff851b;"
            hx-post="{{ _url }}/on" hx-target="#dashboard-table" hx-swap="morph:innerHTML"
            hx-vals='{"_csrf_token": "{{ csrf_token() }}"}'>&#x25BC;</button>
    <button class="outline" title="Take {{ _scope }} nodes out of maintenance (choco will push)" style="padding: 0.1em 0.4em; margin: 0; font-size: 0.8em; background: #0074d9; color: white; border-color: #0074d9;"
            hx-post="{{ _url }}/off" hx-target="#dashboard-table" hx-swap="morph:innerHTML"
            hx-vals='{"_csrf_token": "{{ csrf_token() }}"}'>&#x25B2;</button>
</span>
