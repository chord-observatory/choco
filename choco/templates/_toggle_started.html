<label class="toggle-switch" hx-post="/nodes/toggle-started/{{ key }}" hx-swap="outerHTML"
       hx-vals='{"_csrf_token": "{{ csrf_token() }}"}' title="{{ 'Started\nToggle to set to idle.' if node.started else 'Idle\nToggle to set to started.' }}">
    <input type="checkbox" {{ "checked" if node.started }}>
    <span class="toggle-slider {{ 'started' if node.started else 'idle' }}"></span>
</label>
