{% extends "base.html" %}
{% block title %}Nodes — CHOCO{% endblock %}

{% block content %}
<div class="page-head">
    <h2>Nodes</h2>
    <div class="page-actions">
        {% include "_toggle_maintenance_all.html" %}
        {% include "_toggle_started_all.html" %}
        <a href="/nodes/edit" role="button" class="secondary outline btn-sm"
           title="Edit nodes.yaml: groups, hosts, ports and which config file each node renders">Edit nodes</a>
        <a href="/configs" role="button" class="secondary outline btn-sm"
           title="The config library: every config file, which nodes render or include it, and its editor">Edit configs</a>
    </div>
</div>

<div id="dashboard-table"
     hx-ext="morph"
     hx-get="/partials/dashboard-table"
     hx-trigger="every 2s"
     hx-swap="morph:innerHTML">
    {% include "_dashboard_table.html" %}
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='idiomorph-ext.min.js') }}"></script>
{% endblock %}
